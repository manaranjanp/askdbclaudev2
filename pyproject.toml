[project]
name = "askdb"
version = "0.1.0"
description = "Ask questions of SQLite databases in plain English"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
